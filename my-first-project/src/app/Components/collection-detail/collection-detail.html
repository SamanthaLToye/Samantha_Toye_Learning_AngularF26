<div class="detail-container">
@if (item()){
  <h1>{{ item()?.name }}</h1>
  <p><strong>Category:</strong>{{ item()?.category }}</p>
  <p><strong>Value:</strong>{{ item()?.value }}</p>
  <p><strong>Condition:</strong>{{ item()?.condition || 'Not Specified' }}</p>

  <div class="button-list">
    <a [routerLink]="['/items/edit', item()?.id]" class="edit-btn">Edit Item</a>
    @if (item()?.id !== undefined) {
    <button
      type="button"
      class="save-btn"
      (click)="onToggleSave(toNumber(item()!.id))"
      >
      {{ savedServ.isSaved(toNumber(item()!.id)) ? 'Unsave' : 'Save' }}
    </button>
    }
  </div>
} @else {
  <p>Item not found.</p>
}
</div>
